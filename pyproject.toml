[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "django-listmonk-mailer"
dynamic = ["version"]
description = "A Django email backend (MAILERS) that delivers mail through listmonk's transactional API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Andrew Dzobko", email = "mytyber@gmail.com" }]
keywords = ["django", "email", "mailers", "listmonk", "transactional", "backend"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = [
    "Django>=6.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-django>=4.9",
]

[project.urls]
Homepage = "https://github.com/Collert/django-listmonk-mailer"
Source = "https://github.com/Collert/django-listmonk-mailer"
Issues = "https://github.com/Collert/django-listmonk-mailer/issues"
Changelog = "https://github.com/Collert/django-listmonk-mailer/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/django_listmonk_mailer/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_listmonk_mailer"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
